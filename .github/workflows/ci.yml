name: CI

on:
  push:
    branches:
      - development
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-sqlite:
    name: Core and SQLite tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install SQLite development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev

      - name: Configure deterministic test slice
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_DISABLE_FIND_PACKAGE_MySQL=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_PostgreSQL=TRUE \
            -DENABLE_TEST_DB_FIXTURES=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build deterministic test targets
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            coda_db_test \
            coda_db_test_sqlite 2>&1 | tee db-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-build-diagnostics
          path: db-build.log
          if-no-files-found: error

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure -V 2>&1 | tee db-test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-test-diagnostics
          path: db-test.log
          if-no-files-found: error

  coverage:
    name: Target-local core and SQLite coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install SQLite and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev lcov

      - name: Configure deterministic coverage slice
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_DISABLE_FIND_PACKAGE_MySQL=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_PostgreSQL=TRUE \
            -DENABLE_TEST_DB_FIXTURES=OFF \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build deterministic coverage targets
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-coverage --parallel 2 --target \
            coda_db_test \
            coda_db_test_sqlite 2>&1 | tee db-coverage-build.log

      - name: Upload coverage-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-coverage-build-diagnostics
          path: db-coverage-build.log
          if-no-files-found: error

      - name: Generate coverage report
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-coverage --target coda_db_coverage 2>&1 | tee db-coverage-report.log

      - name: Upload coverage-report diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-coverage-report-diagnostics
          path: db-coverage-report.log
          if-no-files-found: error

      - name: Verify coverage report
        run: test -f build-coverage/gen/coverage/index.html
